# Instalar como /etc/systemd/logind.conf.d/no-suspender-tapa.conf
#
# El portátil dedicado a este script debe seguir corriendo (y disparando el
# timer) aunque alguien cierre la tapa — spec sección 2. Sin esto, cerrar la
# tapa suspende el equipo y las corridas programadas simplemente no ocurren,
# sin ningún aviso de que se perdieron.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
